<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>VoiceFlow</title>

  <link rel="stylesheet" href="style.css" />
</head>

<body>

  <main class="app">

    <div class="logo">VoiceFlow</div>

    <div class="status" id="status">
      Ready
    </div>

    <section class="hero">

      <div class="orb">
        <div class="mic">🎙️</div>
      </div>

      <h1>Your Voice Assistant</h1>

      <p class="subtitle">
        Speak naturally. Interrupt anytime.
      </p>

      <div class="transcript" id="transcript">
        Say something to get started...
      </div>

      <button id="startButton">
        Start Voice
      </button>

    </section>

    <div class="footer">
      Powered by LiveKit + Rime
    </div>

  </main>

  <script type="module" src="app.js"></script>

</body>
</html>
