<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>VoiceFlow</title>

  <link rel="stylesheet" href="style.css" />
</head>

<body>

  <main class="app">

    <!-- HEADER -->
    <header class="header">

      <div class="logo">
        VoiceFlow
      </div>

      <div class="status" id="status">
        Ready
      </div>

    </header>


    <!-- MAIN -->
    <section class="hero">

      <!-- VOICE ORB -->
      <div class="orb" id="orb">

        <div class="orb-ring"></div>

        <div class="mic">
          🎙️
        </div>

      </div>


      <h1 id="title">
        Your Voice Assistant
      </h1>

      <p class="subtitle" id="subtitle">
        Speak naturally. Interrupt anytime.
      </p>


      <!-- CONVERSATION -->
      <section
        class="conversation"
        id="conversation"
      >

        <div class="conversation-header">
          Conversation
        </div>

        <div
          class="messages"
          id="messages"
        >

          <div class="empty-message">
            Say something to get started...
          </div>

        </div>

      </section>


      <!-- ACTIVITY -->
      <div
        class="activity"
        id="activity"
      >

        <span class="activity-dot"></span>

        <span id="activityText">
          VoiceFlow is ready
        </span>

      </div>


      <!-- BUTTON -->
      <button id="startButton">
        Start Voice
      </button>

    </section>


    <!-- FOOTER -->
    <footer class="footer">
      Powered by LiveKit + Rime
    </footer>

  </main>


  <script
    type="module"
    src="app.js"
  ></script>

</body>
</html>
